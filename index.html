<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <title>偶来小路 · 百公里攻略（济州岛 Jeju Olle Trail）</title>
    <!--
      地图合规说明：
      底图只允许使用具备测绘资质的服务，本项目使用腾讯位置服务。
      济州岛属海外区域，不适用本地代理模式，必须填入自己在腾讯位置服务开放平台申请的 Key；
      未填 Key 时页面自动降级为路线示意图，不影响凑里程等核心功能。
    -->
    <script type="text/javascript">
      window.__TMAP_PROXY__ = 'http://127.0.0.1:__WB_HTTP_PORT__/_TMapService/_wbt/__WB_TMAP_SECRET__'
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
